act_code: '51697'
requisite: Қызылорда облысы Қазалы аудандық мәслихатының 2010 жылғы 26 ақпандағы N 194 шешімі. Қызылорда облысының Әділет департаменті Қазалы аудандық Әділет басқармасында 2010 жылы 08 сәуірде N 10-4-117 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қазалы аудандық мәслихатының 2012 жылғы 11 желтоқсандағы N 356 хатымен)
