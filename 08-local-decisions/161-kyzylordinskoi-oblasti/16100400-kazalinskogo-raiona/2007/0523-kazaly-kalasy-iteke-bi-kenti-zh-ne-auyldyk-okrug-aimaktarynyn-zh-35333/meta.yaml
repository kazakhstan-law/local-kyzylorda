requisite: Қызылорда облысы Қазалы аудандық мәслихатының 2007 жылғы 23 мамырдағы № 266 шешімі. Қызылорда облысының Әділет басқармасында 2007 жылғы 20 маусымда № 10-4-66 болып тіркелді
title:
