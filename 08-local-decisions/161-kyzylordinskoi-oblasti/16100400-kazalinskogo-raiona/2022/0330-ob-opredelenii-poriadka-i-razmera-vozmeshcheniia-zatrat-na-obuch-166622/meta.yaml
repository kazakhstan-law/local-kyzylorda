  title:
    rus: О внесении изменений в решение маслихата от 30 марта 2022 года № 207 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Казалинском районе»
    kaz: Мәслихаттың 2022 жылғы 30 наурыздағы №207 «Қазалы ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
