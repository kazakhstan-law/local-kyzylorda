act_code: '48436'
requisite: Қызылорда облысы Қазалы аудандық мәслихатының 2009 жылғы 30 қыркүйектегі N 151 шешімі. Қызылорда облысының Әділет департаменті Қазалы ауданының Әділет басқармасында 2009 жылы 03 қарашада N 10-4-103 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қазалы аудандық мәслихатының 2012 жылғы 11 желтоқсандағы N 356 хатымен)
title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына отын сатып алу үшін әлеуметтік көмек беру Қағидасын бекіту туралы
