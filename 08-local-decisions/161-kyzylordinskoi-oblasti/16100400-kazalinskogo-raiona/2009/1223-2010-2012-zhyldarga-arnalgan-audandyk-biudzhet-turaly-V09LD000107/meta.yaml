  requisite: Қызылорда облысы Қазалы аудандық мәслихатының 2010 жылғы 30 шілдедегі N 220 шешімі. Қызылорда облысының Әділет департаменті Қазалы ауданының Әділет басқармасында 2010 жылы 01 қыркүйекте N 10-4-125 тіркелді. Күші жойылды - Қызылорда облысы Қазалы аудандық мәслихатының 2011 жылғы 04 наурыздағы N 272 шешімімен
