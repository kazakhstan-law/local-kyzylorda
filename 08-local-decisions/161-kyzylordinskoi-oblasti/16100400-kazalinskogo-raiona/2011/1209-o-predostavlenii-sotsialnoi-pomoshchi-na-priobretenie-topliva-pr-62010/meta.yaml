requisite: Решение Казалинского районного маслихата Кызылординской области от 9 декабря 2011 года № 330. Зарегистрировано Департаментом юстиции Кызылординской области 20 декабря 2011 года за № 10-4-162. Утратило силу в связи с истечением срока применения - (письмо Казалинского районного маслихата Кызылординской области от 11 декабря 2012 года № 356)
title:
  rus: О предоставлении социальной помощи на приобретение топлива проживающим и работающим в сельских населенных пунктах специалистом организаций социального обеспечения, культуры, спорта и работающим в сельской местности педагогическим работникам образования, медицинским и фармацевтическим работникам организаций государственного сектора здравоохранения
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет, спорт ұйымдарының мамандарына, ауылдық жерде жұмыс істейтін білім берудің педагог қызметкерлеріне және мемлекеттік денсаулық сақтау секторы ұйымдарының медицина және фармацевтика қызметкерлеріне отын сатып алу үшін әлеуметтік көмек беру туралы
