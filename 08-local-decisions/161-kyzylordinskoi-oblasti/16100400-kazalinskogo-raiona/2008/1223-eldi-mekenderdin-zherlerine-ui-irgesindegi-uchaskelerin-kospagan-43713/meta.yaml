act_code: '43713'
requisite: Қызылорда облысы Қазалы аудандық мәслихатының 2008 жылғы 23 желтоқсандағы N 107 шешімі. Қызылорда облысының Әділет департаменті Қазалы аудандық Әділет басқармасында 2009 жылғы 22 қаңтарда N 10-4-89 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қазалы аудандық мәслихатының 2014 жылғы 27 тамыздағы N 01-10/779 хатымен)
