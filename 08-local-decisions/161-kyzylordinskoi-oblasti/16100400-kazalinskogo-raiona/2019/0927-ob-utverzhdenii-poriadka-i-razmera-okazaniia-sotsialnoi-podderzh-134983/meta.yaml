  title:
    rus: О внесении изменений в решение Казалинского районного маслихата от 27 сентября 2019 года № 318 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: «Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау,  әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Қазалы аудандық мәслихатының 2019 жылғы 27 қыркүйектегі № 318 шешіміне өзгерістер енгізу туралы
