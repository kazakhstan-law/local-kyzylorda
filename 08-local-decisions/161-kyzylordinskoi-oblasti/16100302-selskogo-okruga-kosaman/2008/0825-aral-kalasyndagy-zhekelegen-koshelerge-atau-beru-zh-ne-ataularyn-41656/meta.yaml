requisite: Қызылорда облысы Арал қаласы әкімінің 2008 жылғы 25 тамыздағы N 535 шешімі. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2008 жылғы 23 қыркүйекте N 10-3-123 тіркелді. Күші жойылды - Қызылорда облысы Арал қаласы әкімінің 2012 жылғы 18 қазандағы N 531 шешімімен
