act_code: '52313'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 30 наурыздағы N 170 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 04 мамырда N 10-5-133 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 22 желтоқсандағы N 229 Шешімімен.
