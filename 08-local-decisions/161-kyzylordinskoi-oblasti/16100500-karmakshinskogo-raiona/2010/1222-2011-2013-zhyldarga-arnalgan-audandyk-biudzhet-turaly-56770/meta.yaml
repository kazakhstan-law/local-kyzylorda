act_code: '56770'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 22 желтоқсандағы N 224 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық әділет басқармасында 2011 жылы 17 қаңтарда N 10-5-154 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Қызылорда облысы Қармақшы аудандық мәслихатының 2012 жылғы 01 наурыздағы N 41 хаты)
