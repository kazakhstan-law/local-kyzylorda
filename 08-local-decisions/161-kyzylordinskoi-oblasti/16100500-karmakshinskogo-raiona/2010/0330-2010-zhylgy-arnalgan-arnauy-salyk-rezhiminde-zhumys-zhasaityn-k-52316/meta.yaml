act_code: '52316'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 30 наурыздағы N 169 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 04 мамырда  N 10-5-136 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 24 маусымдағы N 186 Шешімімен.
title:
