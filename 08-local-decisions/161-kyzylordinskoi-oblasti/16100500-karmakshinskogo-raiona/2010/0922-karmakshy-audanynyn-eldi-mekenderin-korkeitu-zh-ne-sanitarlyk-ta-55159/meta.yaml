act_code: '55159'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 22 қыркүйектегі N 202 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 28 қазанда N 10-5-145 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы аудандық мәслихатының 2011 жылғы 30 маусымдағы N 262 Шешімімен.
title:
  rus: Қармақшы ауданының елді мекендерін көркейту және санитарлық тазалау, жасыл көшеттер мен инфрақұрылым объектілерін ұстау және қорғау жөніндегі Ережені бекіту туралы
