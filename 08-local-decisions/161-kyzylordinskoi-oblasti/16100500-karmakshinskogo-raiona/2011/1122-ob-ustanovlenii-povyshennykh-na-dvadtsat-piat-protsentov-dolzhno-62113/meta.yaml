requisite: Решение Кармакшинского районного маслихата Кызылординской области от 22 ноября 2011 года № 300. Зарегистрировано Департаментом юстиции Кызылординской области 15 декабря 2011 года за № 10-5-170. Утратило силу - Решением Кармакшинского районного маслихата Кызылординской области от 19 ноября 2012 года № 61
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистом сфере здравоохранения, социального обеспечения, образования, культуры и спорта, работающим в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласының мамандарына жиырма бес процентке жоғарыланған лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
