  title:
    rus: О внесении изменений в решение Кармакшинского районного маслихата от 23 февраля 2022 года № 137 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» Қармақшы аудандық мәслихатының 2022 жылғы 23 ақпандағы № 137 шешіміне өзгерістер енгізу туралы
