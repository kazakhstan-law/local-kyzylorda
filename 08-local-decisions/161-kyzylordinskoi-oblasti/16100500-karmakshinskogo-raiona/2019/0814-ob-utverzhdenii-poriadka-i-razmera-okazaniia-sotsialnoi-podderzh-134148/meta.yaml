act_code: '134148'
requisite: Решение Кармакшинского районного маслихата Кызылординской области от 14 августа 2019 года № 256. Зарегистрировано Департаментом юстиции Кызылординской области 16 августа 2019 года № 6892
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах, а также педагогическим работникам сферы образования, работающим в сельской местности Кармакшинского района
  kaz: Қармақшы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына, сонымен қатар ауылдық жерде жұмыс істейтін білім беру саласының педагог қызметкерлеріне бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
