  title:
    rus: О внесении изменений в решение Кармакшинского районного маслихата от 14 августа 2019 года № 256 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах, а также педагогическим работникам образования, работающим в сельской местности»
    kaz: «Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына, сонымен қатар ауылдық жерде жұмыс істейтін білім беру саласының педагог қызметкерлеріне бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Қармақшы аудандық мәслихатының 2019 жылғы 14 тамыздағы № 256 шешіміне өзгерістер енгізу туралы
