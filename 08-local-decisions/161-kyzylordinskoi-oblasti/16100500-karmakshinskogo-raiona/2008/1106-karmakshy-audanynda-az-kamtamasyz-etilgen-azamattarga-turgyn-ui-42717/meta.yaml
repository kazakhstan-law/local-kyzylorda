act_code: '42717'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2008 жылғы 06 қарашадағы N 77 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2008 жылы 15 желтоқсанда N 10-5-100 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 14 сәуірдегі N 178 Шешімімен
title:
  rus: Қармақшы ауданында аз қамтамасыз етілген азаматтарға тұрғын үй ұстауға және коммуналдық қызметтің ақысын төлеуге арналған тұрғын үй көмегін көрсету Қағидасын және коммуналдық қызмет түрлері мен нормативтерін бекіту туралы
