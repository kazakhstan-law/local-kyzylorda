act_code: '41953'
requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2008 жылғы 30 қыркүйектегі N 70 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2008 жылы 23 қазанда N 10-5-95 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы аудандық мәслихатының 2009 жылғы 30 наурыздағы N 105 Шешімімен
title:
