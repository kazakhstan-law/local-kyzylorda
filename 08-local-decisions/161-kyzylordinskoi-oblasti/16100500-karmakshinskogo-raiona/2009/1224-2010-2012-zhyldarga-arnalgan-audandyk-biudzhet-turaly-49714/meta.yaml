  requisite: Қызылорда облысы Қармақшы аудандық мәслихатының 2010 жылғы 10 қаңтардағы N 154 шешімі. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 21 қаңтарда N 10-5-118 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасының 2011 жылғы 15 тамыздағы N 2-9/2504 хаты)
  title:
