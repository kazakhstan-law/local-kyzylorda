    kaz: «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өтеу мөлшері мен тәртібін айқындау туралы» Қармақшы аудандық мәслихатының 2017 жылғы 20 қыркүйектегі №118 шешіміне өзгеріс енгізу туралы
