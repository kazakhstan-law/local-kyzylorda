requisite: Решение от 06.05.2015 №44-3, Маслихат Жалагашского района. Утратило силу решением Жалагашского районного маслихата Кызылординской области от 23.12.2015 № 49-8.
title:
  rus: О предоставлении мер социальной поддержки в 2015 году специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Жалагашского района
  kaz: Жалағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы әлеуметтік қолдау шараларын ұсыну туралы
