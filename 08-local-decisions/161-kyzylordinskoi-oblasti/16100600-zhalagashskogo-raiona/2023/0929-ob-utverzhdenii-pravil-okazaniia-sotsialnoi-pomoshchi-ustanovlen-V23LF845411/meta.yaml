  title:
    rus: О внесении изменения в решение Жалагашского районного маслихата от 29 сентября 2023 года № 7-2 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Жалагашского района»
