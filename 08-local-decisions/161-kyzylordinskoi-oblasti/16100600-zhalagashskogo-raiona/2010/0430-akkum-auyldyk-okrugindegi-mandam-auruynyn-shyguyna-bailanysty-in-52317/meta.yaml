act_code: '52317'
requisite: Қызылорда облысы Жалағаш аудандық әкімінің 2010 жылғы 30 сәуірдегі N 4 шешімі. Қызылорда облысының Әділет департаменті Жалағаш ауданының Әділет басқармасында 2010 жылы 11 мамырда N 10-6-152 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы Аққұм ауылдық округі әкімінің 2010 жылғы 02 қыркүйектегі N 13 шешімімен
