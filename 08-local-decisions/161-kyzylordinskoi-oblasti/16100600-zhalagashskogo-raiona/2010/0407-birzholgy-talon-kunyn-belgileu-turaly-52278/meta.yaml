requisite: Қызылорда облысы Жалағаш аудандық мәслихатының 2010 жылғы 07 сәуірдегі N 29-2 шешімі. Қызылорда облысының Әділет департаменті Жалағаш ауданының Әділет басқармасында 2010 жылы 04 мамырда N 10-6-151 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Қызылорда облысы Жалағаш аудандық мәслихатының 2013 жылғы 31 қаңтардағы N 331 хаты)
