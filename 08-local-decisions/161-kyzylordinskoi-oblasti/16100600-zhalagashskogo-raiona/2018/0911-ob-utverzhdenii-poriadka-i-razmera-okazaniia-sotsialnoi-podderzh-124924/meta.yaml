requisite: Решение Жалагашского районного маслихата Кызылординской области от 11 сентября 2018 года № 28-3. Зарегистрировано Департаментом юстиции Кызылординской области 27 сентября 2018 года № 6442. Утратило силу решением Жалагашского районного маслихата Кызылординской области от 21 октября 2019 года № 46-2
title:
  rus: Об утверждении порядка и  размера оказания социальной поддержки по приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жалагашского района
  kaz: Жалағаш ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу бойынша әлеуметтік қолдау көрсетудің мөлшері мен тәртібін бекіту туралы
