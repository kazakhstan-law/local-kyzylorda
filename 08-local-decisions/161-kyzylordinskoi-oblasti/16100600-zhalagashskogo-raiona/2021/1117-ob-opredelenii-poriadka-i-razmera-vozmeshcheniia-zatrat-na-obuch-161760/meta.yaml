  title:
    rus: О внесении изменений в решение Жалагашского районного маслихата от 17 ноября 2021 года №10-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жалагашском районе»
    kaz: Жалағаш аудандық мәслихатының 2021 жылғы 17 қарашадағы №10-2 «Жалағаш ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
