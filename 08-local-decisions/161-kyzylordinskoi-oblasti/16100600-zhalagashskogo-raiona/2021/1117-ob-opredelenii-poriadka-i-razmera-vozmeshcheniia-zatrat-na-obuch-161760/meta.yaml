  title:
    rus: О внесении изменения в решение Жалагашского районного маслихата от 17 ноября 2021 года № 10-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Жалагашском районе»
    kaz: «Жалағаш ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» Жалағаш аудандық мәслихатының 2021 жылғы 17 қарашадағы № 10-2 шешіміне өзгеріс енгізу туралы
