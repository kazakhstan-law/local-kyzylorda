requisite: Қызылорда облысы Жалағаш ауданы мәслихатының 2009 жылғы 24 қыркүйектегі N 20-4 шешімі. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2009 жылғы 22 қазанда N 10-6-129 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш аудандық мәслихатының 2011 жылғы 20 маусымдағы N 43-4 шешімімен
