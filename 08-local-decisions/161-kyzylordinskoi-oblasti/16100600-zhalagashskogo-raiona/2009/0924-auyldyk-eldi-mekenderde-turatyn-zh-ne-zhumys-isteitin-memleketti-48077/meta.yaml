  title:
    rus: О внесении изменений в решение Жалагашского районного маслихата от 24 сентября 2009 года N 20-3 "Об утверждении Инструкции выплаты компенсации на возмещение расходов на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельских населенных пунктах"
    kaz: '"Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына отын сатып алуға жұмсалатын шығынды өтеу үшін өтемақы төлеу Нұсқаулығын бекіту туралы" Жалағаш аудандық мәслихатының 2009 жылғы 24 қыркүйектегі N 20-3 шешіміне өзгерістер енгізу туралы'
