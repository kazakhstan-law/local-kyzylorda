requisite: Қызылорда облысы Жалағаш аудандық мәслихатының 2008 жылғы 13 ақпандағы N 5-2 шешімі. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылы 19 ақпанда N 10-6-88 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш аудандық мәслихатының 2008 жылғы 29 сәуірдегі N 7-2 шешімімен
