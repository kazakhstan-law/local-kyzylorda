act_code: '43020'
requisite: Қызылорда облысы Жалағаш аудандық мәслихатының 2008 жылғы 24 желтоқсандағы N 13-8 шешімі. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылы 30 желтоқсанда N 10-6-113 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш аудандық мәслихатының 2009 жылғы 08 қарашадағы N 22-2 шешімімен
