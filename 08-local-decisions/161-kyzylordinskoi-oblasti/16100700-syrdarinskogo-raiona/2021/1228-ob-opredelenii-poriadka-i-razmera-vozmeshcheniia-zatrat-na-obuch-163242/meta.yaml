  title:
    rus: О внесении изменений в решение Сырдарьинского районного маслихата от 28 декабря 2021 года № 108 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Сырдарьинском районе»
    kaz: «Сырдария ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» Сырдария аудандық мәслихатының 2021 жылғы 28 желтоқсандағы № 108 шешіміне өзгерістер енгізу туралы
