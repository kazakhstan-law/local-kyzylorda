    kaz: «Жерлерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффиценттерін бекіту туралы» Сырдария аудандық мәслихатының 2017 жылғы 22 желтоқсандағы № 161 шешіміне өзгерістер енгізу туралы
