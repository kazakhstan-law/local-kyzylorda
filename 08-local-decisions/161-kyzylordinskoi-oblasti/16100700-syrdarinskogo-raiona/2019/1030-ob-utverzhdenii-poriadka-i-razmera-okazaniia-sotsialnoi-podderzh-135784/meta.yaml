  title:
    rus: О внесении изменений в решение Сырдарьинского районного маслихата от 30 октября 2019 года № 343 «Об утверждении порядка и размера оказания социальной поддержки по оплате комунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: «Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Сырдария аудандық мәслихатының 2019 жылғы 30 қазандағы № 343 шешіміне өзгерістер енгізу туралы
