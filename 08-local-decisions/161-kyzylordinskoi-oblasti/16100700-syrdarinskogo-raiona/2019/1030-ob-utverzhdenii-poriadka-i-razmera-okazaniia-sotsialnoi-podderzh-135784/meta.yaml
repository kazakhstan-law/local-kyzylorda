act_code: '135784'
requisite: Решение Сырдарьинского районного маслихата Кызылординской области от 30 октября 2019 года № 343. Зарегистрировано Департаментом юстиции Кызылординской области 1 ноября 2019 года № 6953
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сырдарьинского района
  kaz: Сырдария ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі және мөлшерін бекіту туралы
