act_code: '43289'
requisite: Қызылорда облысы Сырдария аудандық мәслихатының 2008 жылғы 24 желтоқсандағы N 112 шешімі. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2009 жылы 09 қаңтарда N 10-8-81 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2010 жылғы 05 наурыздағы N 233 шешімімен
