title:
  rus: Решение Сырдарьинского районного маслихата от 20 декабря 2022 года №180 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Сырдарьинского районного маслихата»
