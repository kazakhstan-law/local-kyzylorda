requisite: Қызылорда облысы Сырдария аудандық мәслихатының 2009 жылғы 29 сәуірдегі N 155 шешімі. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2009 жылы 10 маусымда N 10-8-92 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2010 жылғы 05 наурыздағы N 233 шешімімен
