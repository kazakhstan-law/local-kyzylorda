requisite: Қызылорда облысы Сырдария аудандық мәслихатының 2009 жылғы 10 шілдедегі N 168 шешімі. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2009 жылы 14 тамызда N 10-8-97 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2011 жылғы 12 мамырдағы N 319 шешімімен
