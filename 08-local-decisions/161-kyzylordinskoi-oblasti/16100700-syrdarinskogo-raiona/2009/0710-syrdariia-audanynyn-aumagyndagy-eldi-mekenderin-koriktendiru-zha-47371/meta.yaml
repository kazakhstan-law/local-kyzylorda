act_code: '47371'
requisite: Қызылорда облысы Сырдария аудандық мәслихатының 2009 жылғы 10 шілдедегі N 167 шешімі. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2009 жылы 14 тамызда N 10-8-98 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2011 жылғы 27 тамыздағы N 339 шешімімен
title:
  rus: '"Сырдария ауданының аумағындағы елді мекендерін көріктендіру, жасыл желекті күтіп ұстау мен қорғаудың Ережесін" бекіту туралы'
