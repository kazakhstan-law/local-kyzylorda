act_code: '181002'
requisite: Решение Сырдарьинского районного маслихата Кызылординской области от 28 апреля 2023 года № 18
title:
  rus: Решение Сырдарьинского районного маслихата от 28 апреля 2023 года №18 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка и сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сырдарьинского района на 2023 год
  kaz: «2023 жылға Сырдария ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы» Сырдария аудандық мәслихатының 2023 жылғы 28 сәуірдегі №18 шешімі
