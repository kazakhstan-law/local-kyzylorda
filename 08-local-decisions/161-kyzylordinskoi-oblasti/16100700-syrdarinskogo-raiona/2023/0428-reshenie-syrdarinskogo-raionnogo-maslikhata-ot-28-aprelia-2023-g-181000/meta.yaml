title:
  rus: Решение Сырдарьинского районного маслихата от 28 апреля 2023 года №24 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Сырдарьинского районного маслихата»
