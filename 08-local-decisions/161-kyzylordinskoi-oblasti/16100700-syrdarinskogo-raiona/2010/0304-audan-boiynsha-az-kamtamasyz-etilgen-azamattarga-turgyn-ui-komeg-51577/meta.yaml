  requisite: Қызылорда облысы Сырдария аудандық мәслихатының 2010 жылғы 16 шілдедегі N 251 шешімі. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2010 жылы 23 тамызда N 10-8-125 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2011 жылғы 15 шілдедегі N 330 шешімімен
  title:
    rus: '"Аудан бойынша аз қамтамасыз етілген азаматтарға тұрғын үй көмегін көрсетудің мөлшері мен тәртібі жөніндегі Қағидасын бекіту туралы" аудандық мәслихаттың 2010 жылғы 05 наурыздағы кезектен тыс ХХІ сессиясының N 232 шешіміне өзгерістер мен толықтырулар енгізу туралы'
