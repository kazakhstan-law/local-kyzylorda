act_code: '207789'
requisite: Решение Сырдарьинского районного маслихата Кызылординской области от 27 февраля 2025 года № 174
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акима поселка и сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сырдарьинского района на 2025 год
  kaz: 2025 жылға Сырдария ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы
