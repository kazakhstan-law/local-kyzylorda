requisite: Решение Шиелийского районного маслихата Кызылординской области от 4 октября 2018 года № 29/15. Зарегистрировано Департаментом юстиции Кызылординской области 19 октября 2018 года № 6466. Утратило силу решением Шиелийского районного маслихата Кызылординской области от 10 апреля 2019 года № 39/6
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шиелийского района
  kaz: Шиелі  ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу бойынша әлеуметтік қолдау көрсетудің мөлшері мен тәртібін бекіту туралы
