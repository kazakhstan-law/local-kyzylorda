  title:
    rus: О внесении изменений в решение Шиелийского районного маслихата от 12 ноября 2021 года № 14/2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Шиелийском районе»
    kaz: «Шиелі ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» Шиелі аудандық мәслихатының 2021 жылғы 12 қарашадағы № 14/2 шешіміне өзгерістер енгізу туралы
