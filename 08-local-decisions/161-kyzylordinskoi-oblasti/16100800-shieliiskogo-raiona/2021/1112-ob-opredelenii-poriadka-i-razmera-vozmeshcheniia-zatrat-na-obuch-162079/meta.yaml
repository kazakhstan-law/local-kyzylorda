    kaz: «Шиелі ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» Шиелі аудандық мәслихатының 2021 жылғы 12 қарашадағы № 14/2 шешіміне өзгерістер енгізу туралы
