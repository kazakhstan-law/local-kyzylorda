  title:
    rus: О внесения изменений в решение Шиелийского районного маслихата от 12 ноября 2021 года №14/2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Шиелийском районе»
    kaz: Шиелі аудандық мәслихатының 2021 жылдың 12 қарашадағы №14/2 «Шиелі ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
