requisite: Қызылорда облысы Шиелі аудандық мәслихатының 2008 жылғы 08 қазандағы N 11/10 шешімі. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2008 жылы 11 қарашада N 10-9-70 тіркелді. Күші жойылды - Қызылорда облысы Шиелі аудандық мәслихатының 2009 жылғы 15 шілдедегі N 19/6 шешімімен
