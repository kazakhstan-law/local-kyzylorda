act_code: '38912'
requisite: Қызылорда облысы Шиелі аудандық мәслихатының 2008 жылғы 26 ақпандағы N 6/2 шешімі. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2008 жылы 26 наурызда N 10-9-55 тіркелді. Күші жойылды - Қызылорда облысы Шиелі аудандық мәслихатының 2009 жылғы 29 қаңтардағы N 14/5 шешімімен
title:
  rus: Шиелі ауданының аумағындағы кәсіпкерліктің кейбір түрлерімен айналысатын салық төлемгерлері үшін салық салу объектісінен алынатын тіркелген жиынтық салығының объектілеріне салынатын ставкаларының мөлшерін белгілеу жайлы
  kaz: Шиелі ауданының аумағындағы кәсіпкерліктің кейбір түрлерімен айналысатын салық төлемгерлері үшін салық салу объектісінен алынатын тіркелген жиынтық салығының объектілеріне салынатын ставкаларының мөлшерін белгілеу жайлы
