requisite: Қызылорда облысы Шиелі ауданы мәслихатының 2008 жылғы 25 желтоқсандағы N 13/4 шешімі. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2009 жылы 13 қаңтарда N 10-9-75 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Шиелі ауданының мәслихат аппаратының 2011 жылғы 08 қарашадағы N 265 хатымен)
