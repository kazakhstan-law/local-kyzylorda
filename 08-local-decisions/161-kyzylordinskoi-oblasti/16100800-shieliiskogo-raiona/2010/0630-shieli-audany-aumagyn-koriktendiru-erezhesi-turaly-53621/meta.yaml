act_code: '53621'
requisite: Қызылорда облысы Шиелі аудандық мәслихатының 2010 жылғы 30 маусымдағы N 33/4 шешімі. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2010 жылы 21 шілдеде N 10-9-122 тіркелді. Күші жойылды - Қызылорда облысы Шиелі аудандық мәслихатының 2011 жылғы 14 қарашадағы N 51/4 шешімімен
