requisite: Қызылорда облысы Шиелі аудандық мәслихатының 2010 жылғы 14 сәуірдегі N 30/7 шешімі. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2010 жылы 13 мамырда  N 10-9-119 тіркелді. Күші жойылды - Қызылорда облысы Шиелі аудандық мәслихатының 2012 жылғы 12 сәуірдегі N 3/4 шешімімен
