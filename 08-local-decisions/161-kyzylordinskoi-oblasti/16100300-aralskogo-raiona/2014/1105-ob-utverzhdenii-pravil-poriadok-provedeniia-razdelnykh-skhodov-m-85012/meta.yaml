requisite: Решение Аральского районного маслихата Кызылординской области от 05 ноября 2014 года N 195. Зарегистрировано Департаментом юстиции Кызылординской области 11 декабря 2014 года N 4815. Утратило силу решением Аральского районного маслихата Кызылординской области от 11.02.2016 № 289.
title:
  rus: Об утверждении правил порядок проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома в Аральском районе
  kaz: Арал ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау Қағидаларын бекіту туралы
