  requisite: Қызылорда облысы Арал аудандық мәслихатының 2009 жылғы 17 шілдедегі N 114 шешімі. Қызылорда облысының Әділет департаменті Арал ауданының әділет басқармасында 2009 жылы 28 шілдеде N 10-3-141 тіркелді. Күші жойылды - Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 05 наурыздағы N 150 шешімімен
  title:
    rus: Аудандық мәслихаттың 2008 жылғы 23 желтоқсандағы кезекті он бірінші сессиясының "2009 жылға арналған аудан бюджеті туралы" N 73 шешіміне өзгерістер мен толықтырулар енгізу туралы
