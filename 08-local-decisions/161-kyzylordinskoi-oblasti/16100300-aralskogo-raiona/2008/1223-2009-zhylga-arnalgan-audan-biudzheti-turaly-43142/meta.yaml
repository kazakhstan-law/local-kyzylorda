  requisite: Қызылорда облысы Арал аудандық мәслихатының 2009 жылғы 30 сәуірдегі N 99 шешімі. Қызылорда облысының Әділет департаменті Арал аудандық Әділет басқармасында 2009 жылы 15 мамырда N 10-3-137 тіркелді. Күші жойылды - Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 05 наурыздағы N 150 шешімімен
  title:
    rus: Аудандық мәслихаттың 2008 жылғы 23 желтоқсанындағы кезекті он бірінші сессиясының "2009 жылға арналған аудан бюджеті туралы" N 73 шешіміне өзгерістер мен толықтырулар енгізу туралы
