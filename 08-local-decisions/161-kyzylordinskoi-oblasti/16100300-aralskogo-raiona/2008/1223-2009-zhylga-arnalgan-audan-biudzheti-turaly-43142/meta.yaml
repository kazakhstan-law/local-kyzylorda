  requisite: Қызылорда облысы Арал аудандық мәслихатының 2009 жылғы 31 наурыздағы N 92 шешімі. Қызылорда облысының Әділет департаментінің Арал аудандық Әділет басқармасының 2009 жылы 14 сәуірде N 10-3-134 тіркелді. Күші жойылды - Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 05 наурыздағы N 150 шешімімен
