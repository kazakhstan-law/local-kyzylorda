  title:
    rus: О внесении изменений в решение Аральского районного маслихата от 11 февраля 2016 года № 289 «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома в Аральском районе»
    kaz: «Арал ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау Қағидаларын бекіту туралы» Арал аудандық мәслихатының 2016 жылғы 11 ақпандағы №289 шешіміне өзгерістер енгізу туралы
