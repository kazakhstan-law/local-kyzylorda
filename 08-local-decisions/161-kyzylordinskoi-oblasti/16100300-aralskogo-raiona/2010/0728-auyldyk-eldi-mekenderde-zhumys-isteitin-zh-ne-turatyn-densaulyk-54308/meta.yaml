act_code: '54308'
requisite: Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 28 шілдедегі N 173 шешімі. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2010 жылы 31 тамызда N 10-3-163 тіркелді. Күші жойылды - Қызылорда облысы Арал аудандық мәслихатының 2011 жылғы 26 тамыздағы N 227 Шешімімен.
title:
  rus: Ауылдық елді мекендерде жұмыс істейтін және тұратын денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік көмек көрсетудің Қағидасы бекіту туралы
