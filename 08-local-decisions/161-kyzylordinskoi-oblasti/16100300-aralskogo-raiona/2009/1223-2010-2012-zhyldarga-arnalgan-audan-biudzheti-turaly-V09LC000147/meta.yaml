  requisite: "Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 23 сәуірдегі N 159 шешімі. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2010 жылы 06 мамырда N 10-3-159 тіркелді. Күші жойылды - \r\nҚызылорда облысы Арал аудандық мәслихатының 2011 жылғы 19 қаңтардағы N 204 шешімімен"
  title:
