  requisite: "Қызылорда облысы Арал аудандық мәслихатының 2010 жылғы 09 сәуірдегі N 153 шешімі. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2010 жылы 14 сәуірде N 10-3-156 тіркелді. Күші жойылды - \r\nҚызылорда облысы Арал аудандық мәслихатының 2011 жылғы 19 қаңтардағы N 204 шешімімен"
