  title:
    rus: О внесении изменения в решение Кызылординского областного маслихата от 21 октября 2020 года № 475 «Об определении систему мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселках, городах районного и областного значения, а также порядок и размер оказания им социальной поддержки за счет бюджетных средств»
    kaz: «Ауылдық жерге және кенттерге, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы» Қызылорда облыстық мәслихатының 2020 жылғы 21 қазандағы № 475 шешіміне өзгеріс енгізу туралы
