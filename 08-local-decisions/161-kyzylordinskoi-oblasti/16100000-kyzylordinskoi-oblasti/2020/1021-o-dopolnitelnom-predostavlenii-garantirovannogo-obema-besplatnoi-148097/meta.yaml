  title:
    rus: О внесении изменений и дополнений в решение Кызылординского областного маслихата от 21 октября 2020 года № 474 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан при амбулаторном лечении бесплатно и (или) на льготных условиях»
    kaz: «Азаматтардың жекелеген санаттарына амбулаториялық емдеу кезінде тегін және (немесе) жеңілдікті шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Қызылорда облыстық мәслихатының 2020 жылғы 21 қазандағы № 474 шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/167023/rus
