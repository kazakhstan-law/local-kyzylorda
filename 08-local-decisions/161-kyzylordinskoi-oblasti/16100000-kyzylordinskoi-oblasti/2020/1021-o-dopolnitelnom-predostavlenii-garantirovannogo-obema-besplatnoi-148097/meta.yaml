act_code: '148097'
requisite: Решение Кызылординского областного маслихата от 21 октября 2020 года № 474. Зарегистрировано Департаментом юстиции Кызылординской области 2 ноября 2020 года № 7771. Утратило силу решением Кызылординского областного маслихата от 23 октября 2024 года № 120
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированные лечебных продуктов, медицинских изделий, отдельным категориям граждан Кызылординской области при амбулаторном лечении бесплатных условиях
  kaz: Қызылорда облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы
