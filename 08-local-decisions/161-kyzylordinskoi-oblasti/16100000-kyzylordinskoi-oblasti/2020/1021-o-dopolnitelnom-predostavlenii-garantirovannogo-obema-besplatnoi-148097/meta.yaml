  title:
    rus: О внесении изменения и дополнения в решение Кызылординского областного маслихата от 21 октября 2020 года № 474 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Кызылординской области при амбулаторном лечении бесплатных условиях»
    kaz: Қызылорда облыстық мәслихатының 2020 жылғы 21 қазандағы № 474 «Қызылорда облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
