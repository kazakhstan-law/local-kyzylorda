  requisite: Решение Кызылординского областного маслихата от 29 апреля 2026 года № 244
  title:
    rus: О внесении изменения в решение Кызылординского областного маслихата от 23 октября 2024 года № 121 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированные лечебных продуктов, медицинских изделий, отдельным категориям граждан Кызылординской области при амбулаторном лечении бесплатных условиях»
    kaz: «Қызылорда облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Қызылорда облыстық мәслихатының 2024 жылғы 23 қазандағы № 121 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/224757/rus
