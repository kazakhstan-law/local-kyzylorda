requisite: Решение Кызылординского областного маслихата от 24 декабря 2021 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2021 года № 26083. Утратило силу решением Кызылординского областного маслихата от 9 декабря 2025 года № 208
title:
  rus: Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Кызылординской области
  kaz: Қызылорда облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
