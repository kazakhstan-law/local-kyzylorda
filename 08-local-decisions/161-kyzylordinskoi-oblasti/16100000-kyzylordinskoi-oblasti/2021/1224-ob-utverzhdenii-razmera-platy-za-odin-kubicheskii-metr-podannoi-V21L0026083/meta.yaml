  title:
    rus: О признании утратившим силу решения Кызылординского областного маслихата от 24 декабря 2021 № 82 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Кызылординской области»
    kaz: «Қызылорда облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын су мен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту» Қызылорда облыстық мәслихатының 2021 жылғы 24 желтоқсандағы № 82 шешімінің күші жойылды деп тану туралы
