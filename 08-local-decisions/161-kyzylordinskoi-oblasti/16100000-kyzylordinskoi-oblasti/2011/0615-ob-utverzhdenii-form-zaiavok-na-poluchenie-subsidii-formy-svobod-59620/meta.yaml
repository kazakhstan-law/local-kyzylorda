act_code: '59620'
requisite: Решение акима Кызылординской области от 15 июня 2011 года № 4. Зарегистрировано Департаментом юстиции Кызылординской области 14 июля 2011 года за № 4270. Утратило силу решением акима Кызылординской области от 6 марта 2012 года № 28
title:
  rus: Об утверждении форм заявок на получение субсидий, формы свободного акта о реализации животноводческой продукции по району, формы сводного списка распределения квот на производство субсидируемого объема животноводческой продукции и размеров субсидий среди товаропроизводителей, формы сводной ведомости по области об объемах реализованной животноводческой продукции и выплате субсидий, формы отчета (информации) по освоению средств по области, формы отчета (информации) по объемам реализации животноводческой продукции
  kaz: Субсидиялар алуға өтінімдер нысандары, аудан бойынша мал шаруашылығы өнімін сату туралы жиынтық актінің нысаны, мал шаруашылығы өнімінің субсидияланатын көлемін өндіруге квоталар мен тауар өндірушілер арасында субсидиялар мөлшерін бөлу жиынтық тізімінің нысаны, мал шаруашылығы өнімінің сатылған көлемі және субсидиялар төлеу туралы облыс бойынша жиынтық ведомостінің нысаны, облыс бойынша қаражатты игеру жөнінде есеп (ақпарат) нысаны, мал шаруашылығы өнімін сату көлемі жөнінде есеп (ақпарат) нысанын бекіту туралы
