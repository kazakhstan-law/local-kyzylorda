act_code: '59621'
requisite: Решение акима Кызылординской области от 15 июня 2011 года N 5. Зарегистрировано Департаментом юстиции Кызылординской области 14 июля 2011 года за N 4271. Утратило силу решением акима Кызылординской области от 06 марта 2012 года N 28
title:
  rus: Об утверждении типовой формы договора купли-продажи племенной продукции (материала) (за исключением договора лизинга), форм заявок на получение субсидий за приобретенную племенную продукцию (материал), формы акта осеменения коров и телок, формы сводного акта о приобретении племенной продукции и использования племенного материала и сумме причитающейся субсидий по области, формы отчета (информация) по освоению бюджетных средств по области, фомы отчета (информация) по объемам приобретения племенной продукции (материала) за квартал по области
  kaz: Асыл тұқымды өнімді (материалды) сатып алу-сату шартының үлгілік нысанын (лизинг шартын қоспағанда), сатып алынған асыл тұқымды өнімге (материалға) субсидия алуға өтінімдер нысандарын, сиыр мен қашарларды ұрықтандыру актісінің нысанын, асыл тұқымды өнім сатып алу мен асыл тұқымды материалды қолдану және облыс бойынша тиесілі субсидия  сомасы туралы жиынтық актінің нысанын, облыс бойынша бюджеттік қаражатты игеру жөніндегі есеп (ақпарат) нысанын,облыс бойынша асыл тұқымды өнімді (материалды) сатып алу көлемі жөніндегі тоқсандық есеп (ақпарат) нысанын бекіту туралы
