title:
  rus: О признании утратившим силу решение Кызылординского областного маслихата от 16 сентября 2015 года № 306 "Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарата Кызылординского областного маслихата"
  kaz: '"Қызылорда облыстық мәслихатының аппараты" мемлекеттік мекемесінің "Б" корпусы мемлекеттік әкімшілік қызметшілердің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы" Қызылорда облыстық мәслихатының 2015 жылғы 16 қыркүйектегі № 306 шешімінің күшін жою туралы'
