  title:
    rus: О внесении изменений в решение Кызылординского областного маслихата от 10 февраля 2016 года № 347 «О дополнительном предоставлении лекарственных средств отдельным категориям граждан Кызылординской области при амбулаторном лечении бесплатно и на льготных условиях»
    kaz: «Қызылорда облысы азаматтарының жекелеген санаттарына амбулаториялық емделу кезінде тегін және жеңілдікті шарттармен дәрілік заттарды қосымша беру туралы» Қызылорда облыстық мәслихатының 2016 жылғы 10 ақпандағы № 347 шешіміне өзгерістер енгізу туралы
