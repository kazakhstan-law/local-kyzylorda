  title:
    rus: О внесении изменения в решение Кызылординского областного маслихата от 16 октября 2019 года № 358 «Об определении Правил и размера оказания социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность Кызылординской области за счет средств областного бюджета»
    kaz: «Қызылорда облысының ауылдық жеріне жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне облыстық бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің қағидалары мен мөлшерлерін айқындау туралы» Қызылорда облыстық мәслихатының 2019 жылғы 16 қазандағы № 358 шешіміне өзгеріс енгізу туралы
