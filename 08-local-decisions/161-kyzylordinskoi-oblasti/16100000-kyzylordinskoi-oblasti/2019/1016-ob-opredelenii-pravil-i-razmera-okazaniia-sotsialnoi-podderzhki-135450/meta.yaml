title:
  rus: Об определении Правил и размера оказания социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность Кызылординской области за счет средств областного бюджета
  kaz: Қызылорда облысының ауылдық жеріне жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне облыстық бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің қағидалары мен мөлшерлерін айқындау туралы
