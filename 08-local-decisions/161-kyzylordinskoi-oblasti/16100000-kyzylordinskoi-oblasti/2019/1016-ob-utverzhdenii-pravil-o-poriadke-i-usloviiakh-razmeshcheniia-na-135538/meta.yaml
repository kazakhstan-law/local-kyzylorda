act_code: '135538'
requisite: Решение Кызылординского областного маслихата от 16 октября 2019 года № 356. Зарегистрировано Департаментом юстиции Кызылординской области 23 октября 2019 года № 6944
title:
  rus: Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования в Кызылординской области
  kaz: Қызылорда облысында сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы
