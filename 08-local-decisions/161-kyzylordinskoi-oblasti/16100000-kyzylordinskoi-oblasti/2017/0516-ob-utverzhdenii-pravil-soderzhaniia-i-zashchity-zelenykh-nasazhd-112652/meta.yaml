    kaz: «Қызылорда облысындағы жасыл екпелерді күтіп-ұстау және қорғау, қалалар және елді мекендердің аумақтарын абаттандырудың қағидаларын бекіту туралы» Қызылорда облыстық мәслихатының 2017 жылғы 16 мамырдағы № 121 шешіміне өзгеріс енгізу туралы
