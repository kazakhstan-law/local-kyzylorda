    rus: О внесении изменений в решение Кызылординского областного маслихата от 9 декабря 2025 года № 209 «Об утверждении размера платы за один кубический метр питьевой воды, поданной из систем водоснабжения, включенных в перечень систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию»
    kaz: «Қызылорда облысында ауызсу беру бойынша көрсетілетін қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне енгізілген сумен жабдықтау жүйелерінен берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» Қызылорда облыстық мәслихатының 2025 жылғы 9 желтоқсандағы № 209 шешіміне өзгерістер енгізу туралы
