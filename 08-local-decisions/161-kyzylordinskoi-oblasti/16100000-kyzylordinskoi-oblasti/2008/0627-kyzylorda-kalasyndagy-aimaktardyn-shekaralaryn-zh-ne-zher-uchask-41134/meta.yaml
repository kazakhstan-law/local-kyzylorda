requisite: Қызылорда облыстық мәслихатының 2008 жылғы 27 маусымдағы № 83 шешімі. Қызылорда облысының Әділет департаментінде 2008 жылғы 08 тамызда № 4207 болып тіркелді. Күші жойылды - Қызылорда облыстық мәслихатының 2016 жылғы 28 қыркүйектегі № 58 шешімімен
