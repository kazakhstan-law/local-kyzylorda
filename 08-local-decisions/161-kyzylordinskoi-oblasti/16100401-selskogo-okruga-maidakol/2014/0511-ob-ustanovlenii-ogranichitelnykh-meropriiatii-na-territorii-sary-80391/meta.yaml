  title:
    rus: 'О внесении измененийв решение акима сельского округа Сарыколь от 12 мая 2014 года №2«Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территории Сарыкольского сельского округа» '
    kaz: «Сарыкөл ауылдық округі аумағында шектеу іс шараларын енгізе отырып, карантин аймағының ветеринарлық режимін белгілеу туралы» Сарыкөл ауылдық округі әкімінің 2014 жылғы 12 мамырдағы №2 шешіміне өзгерістер енгізу туралы
