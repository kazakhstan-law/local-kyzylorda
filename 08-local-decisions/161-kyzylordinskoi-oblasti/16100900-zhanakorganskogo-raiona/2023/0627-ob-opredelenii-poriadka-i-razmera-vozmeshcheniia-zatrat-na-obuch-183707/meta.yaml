  title:
    rus: О внесении изменений в решение маслихата Жанакорганского района от 27 июня 2023 года № 50 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Жанакорганском районе»
    kaz: «Жаңақорған ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өтеу тәртiбі мен мөлшерін айқындау туралы» Жаңақорған ауданы мәслихатының 2023 жылғы 27 маусымдағы № 50 шешіміне өзгерістер енгізу туралы
