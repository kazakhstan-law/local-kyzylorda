  requisite: Решение Жанакорганского районного акима Кызылординской области от 5 апреля 2011 года № 59. Зарегистрировано Управление юстиции Жанакорганского района Кызылординской области 21 апреля 2011 года за № 10-7-139. Утратило силу решением акима Жанакорганского района Кызылординской области от 20 декабря 2011 года № 67
  title:
    rus: О внесении изменении в решения акима района N 46 от 11 ноября 2010 года  "О проведении работ по регистрации в районном призывном участке граждан 1994 года рождения и не прошедших ранее регистрации на территории района" и N 53 от 21 февраля 2011 года "О внесении изменении в решения акима района N 46 от 11 ноября 2010 года "О проведении работ по регистрации в районном призывном участке граждан 1994 года рождения и не прошедших ранее регистрации на территории района"
    kaz: Аудан әкімінің 2010 жылғы 11 қарашадағы "Аудан көлемінде 1994 жылы туылғандарды және бұрын тіркеуден өтпеген азаматтарды аудандық шақыру учаскесіне тіркеуге алу жұмыстарын жүргізу туралы" N 46 шешіміне және 2011 жылғы 21 ақпандағы "Аудан әкімінің 2010 жылғы 11 қарашадағы "Аудан көлемінде 1994 жылы туылғандарды және бұрын тіркеуден өтпеген азаматтарды аудандық шақыру учаскесіне тіркеуге алу жұмыстарын жүргізу туралы" N 46 шешіміне өзгертулер енгізу туралы" N 53 шешіміне өзгерістер енгізу туралы
