  requisite: Решение акима Жанакорганского района Кызылординской области от 21 февраля 2011 года N 53. Зарегистрировано Управлением юстиции Жанакорганского района Кызылординской области 14 марта 2011 года N 10-7-135. Утратило силу решением акима Жанакорганского района Кызылординской области от 20 декабря 2011 года N 67
  title:
    rus: О внесений изменений в решения акима района N 46 от 11 ноября 2010 года "О проведений работ по регистраций в районном призывном участке граждан 1994 года рождения и не прошедщих ранее регистраций на территорий района"
    kaz: Аудан әкімінің 2010 жылғы 11 қарашадағы "Аудан көлемінде 1994 жылы туылғандарды және бұрын тіркеуден өтпеген азаматтарды аудандық шақыру учаскесіне тіркеуге алу жұмыстарын жүргізу туралы" N 46 шешіміне өзгертулер енгізу туралы
