act_code: '56768'
requisite: Қызылорда облысы Жаңақорған аудандық мәслихатының 2010 жылғы 24 желтоқсандағы N 277 шешімі. Қызылорда облысының Әділет департаменті Жаңақорған аудандық Әділет басқармасында 2011 жылы 12 қаңтарда N 10-7-123 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Қызылорда облысы Жаңақорған аудандық мәслихатының 2012 жылғы 05 маусымдағы N 119 хатымен)
