requisite: Решение Жанакорганского районного маслихата Кызылординской области от 24 октября 2018 года № 271. Зарегистрировано Департаментом юстиции Кызылординской области 26 октября 2018 года № 6486. Утратило силу решением Жанакорганского районного маслихата Кызылординской области от 13 ноября 2019 года № 375
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки поприобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жанакорганского района
  kaz: Жаңақорған ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу бойынша әлеуметтік қолдау көрсетудің мөлшері мен тәртібін бекіту туралы
