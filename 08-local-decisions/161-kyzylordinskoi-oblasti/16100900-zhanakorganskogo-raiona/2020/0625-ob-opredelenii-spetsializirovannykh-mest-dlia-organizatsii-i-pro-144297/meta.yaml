  title:
    rus: О внесении изменений в решение маслихата Жанакорганского района от 25 июня 2020 года № 467 «Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования и норм их предельной заполняемости, требований к материально-техническому и организационному обеспечению специализированных мест, а также границ прилегающих территорий, в которых запрещено проведение пикетирования»
    kaz: «Бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, олардың пайдалану тәртібі мен шекті толу нормаларын, материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, сондай-ақ пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» Жаңақорған ауданы мәслихатының 2020 жылғы 25 маусымдағы № 467 шешіміне өзгерістер енгізу туралы
