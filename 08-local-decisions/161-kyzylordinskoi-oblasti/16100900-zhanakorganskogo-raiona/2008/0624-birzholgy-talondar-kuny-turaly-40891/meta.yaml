act_code: '40891'
requisite: Қызылорда облысы Жаңақорған аудандық мәслихатының 2008 жылғы 24 маусымдағы кезекті VI сессиясының N 63 шешімі. Қызылорда облысының Әділет департаменті Жаңақорған аудандық Әділет басқармасында 2008 жылы 30 шілдеде N 10-7-58 тіркелді. Күші жойылды - Қызылорда облысы Жаңақорған аудандық мәслихатының 2008 жылғы 24 желтоқсандағы кезекті ХІ сессиясының N 101 шешімімен
