title:
  rus: О признании утратившим силу решения Кызылординского городского маслихата «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Кызылординского городского маслихата» от 16 марта 2018 года № 145-23/5
  kaz: Қызылорда қалалық мәслихатының «Қызылорда қалалық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы» 2018 жылғы 16 наурыздағы № 145- 23/5 шешімінің күшін жою туралы
