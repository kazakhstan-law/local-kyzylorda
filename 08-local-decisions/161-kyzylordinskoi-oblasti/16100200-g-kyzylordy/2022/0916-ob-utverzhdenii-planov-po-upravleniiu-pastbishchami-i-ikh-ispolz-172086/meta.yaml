title:
  rus: Об утверждении планов по управлению пастбищами и их использованию по сельским округам Аксуат, Кызылжарма, Акжарма, Талсуат, Кызылозек, Косшынырау, Карауылтобе и поселкам Тасбугет, Белкуль относящихся к городу Кызылорда на 2022-2023 годы
  kaz: Қызылорда қаласына қарасты Ақсуат, Қызылжарма, Ақжарма, Талсуат, Қызылөзек, Қосшыңырау, Қарауылтөбе ауылдық округтері мен Тасбөгет, Белкөл кенттері бойынша 2022-2023 жылдарға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарларын бекіту туралы
