  title:
    rus: О внесении изменений и дополнений в решение Кызылординского городского маслихата от 14 сентября 2023 года № 63-8/5 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Кызылорда»
    kaz: «Қызылорда қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Қызылорда қалалық мәслихатының 2023 жылғы 14 қыркүйектегі № 63-8/5 шешіміне өзгерістер мен толықтырулар енгізу туралы
