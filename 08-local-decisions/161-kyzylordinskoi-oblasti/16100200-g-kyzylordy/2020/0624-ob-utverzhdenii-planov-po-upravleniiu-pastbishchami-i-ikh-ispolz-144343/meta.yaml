title:
  rus: Об утверждении планов по управлению пастбищами и их использованию по сельским округам Аксуат, Кызылжарма, Акжарма, Талсуат, Кызылозек, Косшынырау, Карауылтобе и поселкам Тасбугет, Белкуль города Кызылорды на 2020-2021 годы
  kaz: Қызылорда қаласы Ақсуат, Қызылжарма, Ақжарма, Талсуат, Қызылөзек, Қосшыңырау, Қарауылтөбе ауылдық округтері мен Тасбөгет, Белкөл кенттері бойынша 2020-2021 жылдарға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарларын бекіту туралы
