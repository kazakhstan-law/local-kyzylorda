  title:
    rus: О внесении изменении в решение Кызылординского городского маслихата от 24 июня 2020 года №350-62/8 «Об утверждении планов по управлению пастбищами и их использованию по сельским округам Аксуат, Кызылжарма, Акжарма, Талсуат, Кызылозек, Косшынырау, Карауылтобе и поселкам Тасбугет, Белкуль города Кызылорды на 2020-2021 годы»
    kaz: «Қызылорда қаласы Ақсуат, Қызылжарма, Ақжарма, Талсуат, Қызылөзек, Қосшыңырау, Қарауылтөбе ауылдық округтері мен Тасбөгет, Белкөл кенттері бойынша 2020-2021 жылдарға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарларын бекіту туралы» Қызылорда қалалық мәслихатының 2020 жылғы 24 маусымдағы №350-62/8 шешіміне өзгерістер енгізу туралы
