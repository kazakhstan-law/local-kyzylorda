  title:
    rus: О внесении изменений в решение Кызылординского городского маслихата от 24 июня 2020 года № 347-62/5 «Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования и норм их предельной заполняемости, требований к материально-техническому и организационному беспечению специализированных мест, а также границ прилегающих территорий, в которых запрещено проведение пикетирования»
    kaz: «Бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, олардың пайдалану тәртібі мен шекті толу нормаларын, материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, сондай-ақ пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» Қызылорда қалалық мәслихатының 2020 жылғы 24 маусымдағы № 347-62/5 шешіміне өзгерістер енгізу туралы
