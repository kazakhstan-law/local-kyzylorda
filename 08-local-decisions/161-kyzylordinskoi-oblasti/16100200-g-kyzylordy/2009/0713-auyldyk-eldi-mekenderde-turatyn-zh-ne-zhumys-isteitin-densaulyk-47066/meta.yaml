requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2009 жылғы 13 шілдедегі N 20/4 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2009 жылы 30 шілдеде N 10-1-115 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық мәслихатының 2012 жылғы 29 наурыздағы N 3/5 Шешімімен
title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына, ауылдық жерде жұмыс істейтін білім беру мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы Қағидасын бекіту туралы
