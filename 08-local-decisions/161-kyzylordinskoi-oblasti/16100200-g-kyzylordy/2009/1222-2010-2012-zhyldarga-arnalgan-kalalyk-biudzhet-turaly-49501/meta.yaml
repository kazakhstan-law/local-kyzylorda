  requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2010 жылғы 14 шілдедегі N 31/2 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2010 жылы 28 шілдеде N 10-1-147 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қызылорда қалалық мәслихат аппарат жетекшісінің 2011 жылғы 29 тамыздағы N 455/1 хатымен)
