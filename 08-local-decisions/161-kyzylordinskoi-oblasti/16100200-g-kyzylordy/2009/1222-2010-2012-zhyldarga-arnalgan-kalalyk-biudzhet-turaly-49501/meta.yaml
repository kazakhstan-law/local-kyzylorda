  requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2010 жылғы 13 сәуірдегі N 29/6 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қаласының Әділет басқармасында 2010 жылы 16 сәуірде N 10-1-133 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қызылорда қалалық мәслихат аппарат жетекшісінің 2011 жылғы 29 тамыздағы N 455/1 хатымен)
