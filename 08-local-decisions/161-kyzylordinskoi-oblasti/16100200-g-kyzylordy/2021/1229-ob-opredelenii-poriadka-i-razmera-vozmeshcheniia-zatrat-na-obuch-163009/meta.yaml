act_code: '163009'
requisite: Решение Кызылординского городского маслихата от 29 декабря 2021 года № 107-16/10. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 января 2022 года № 26393
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Кызылорда
  kaz: Қызылорда қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өтеу тәртібі мен мөлшерін айқындау туралы
