  title:
    rus: О внесении изменений в решение Кызылординского городского маслихата от 29 декабря 2021 года № 107-16/10 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарды өндіріп алу тәртібі мен мөлшерін айқындау туралы» Қызылорда қалалық мәслихатының 2021 жылғы 29 желтоқсандағы № 107-16/10 шешіміне өзгерістер енгізу туралы
