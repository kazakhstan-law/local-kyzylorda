  title:
    rus: О внесении изменения в решение Кызылординского городского маслихата от 23 августа 2019 года № 252-45/4 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: «Ауылдық елдi мекендерде тұратын және жұмыс iстейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетiлетiн қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтiк қолдау көрсету тәртiбiн және мөлшерiн бекiту туралы» Қызылорда қалалық мәслихатының 2019 жылғы 23 тамыздағы № 252-45/4 шешiмiне өзгеріс енгізу туралы
