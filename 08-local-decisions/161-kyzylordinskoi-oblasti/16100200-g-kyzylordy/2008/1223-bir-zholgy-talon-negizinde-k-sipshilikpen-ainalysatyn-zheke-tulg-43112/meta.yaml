act_code: '43112'
requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 23 желтоқсандағы N 13/10 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 31 желтоқсанда N 10-1-104 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық мәслихатының 2011 жылғы 26 қаңтардағы N 38/2 шешімімен
