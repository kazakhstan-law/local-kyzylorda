act_code: '38129'
requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 08 ақпандағы N 4/8 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 03 наурызда N 10-1-80 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық мәслихатының 2011 жылғы 14 маусымдағы N 43/11 шешімімен
title:
  rus: Қызылорда қаласындағы жергілікті бюджетте қаралған қаржы есебінен халықтың әлеуметтік жағынан қорғалатын топтарына тұрғын үй-жайды жалға алу ақысын төлеу тәртібінің Қағидасын бекіту туралы
