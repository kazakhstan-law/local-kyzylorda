requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 23 желтоқсандағы N 13/13 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 31 желтоқсанда N 10-1-105 тіркелді. Күші жойылды - Қызылорда қалалық мәслихатының 2011 жылғы 11 қарашадағы N 49/3 Шешімімен.
title:
  rus: Қызылорда қаласының аумағында заңды тұлғалар және кәсіпкерлік қызметпен айналысатын жеке тұлғалардан алынатын жер салығының базалық мөлшерлемесін бекіту туралы
