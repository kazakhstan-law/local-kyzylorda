act_code: '39616'
requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 18 сәуірдегі N 6/5 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 15 мамырда N 10-1-89 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық мәслихатының 2013 жылғы 28 наурыздағы N 15/6 шешімімен
