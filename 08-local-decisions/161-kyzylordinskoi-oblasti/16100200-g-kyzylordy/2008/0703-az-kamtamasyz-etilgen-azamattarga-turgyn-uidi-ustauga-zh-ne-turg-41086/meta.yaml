act_code: '41086'
requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 03 шілдедегі N 9/3 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 08 тамызда N 10-1-91 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қызылорда қалалық мәслихат хатшысының 2010 жылғы 13 мамырдағы N 264 хатымен)
title:
