act_code: '43070'
requisite: Қызылорда облысы Қызылорда қалалық мәслихатының 2008 жылғы 23 желтоқсандағы N 13/2 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 29 желтоқсанда N 10-1-102 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы Қызылорда қалалық мәслихат хатшысының 2010 жылғы 13 мамырдағы N 264 хатымен)
