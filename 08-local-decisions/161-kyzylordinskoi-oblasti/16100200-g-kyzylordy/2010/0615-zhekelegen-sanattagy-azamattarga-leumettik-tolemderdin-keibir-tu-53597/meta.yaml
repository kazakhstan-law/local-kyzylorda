requisite: Қызылорда қаласы әкімдігінің 2010 жылғы 15 маусымдағы N 3232 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2010 жылы 21 шілде N 10-1-146 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда қаласы әкімдігі "Қалалық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесінің 2013 жылғы 24 қаңтардағы N 08-4/194 хатымен)
